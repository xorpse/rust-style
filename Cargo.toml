[workspace]
members = [
    "manual_type_annotations_in_let_statements",
    "to_string_on_string_types",
    "unnecessary_qualified_type_paths",
]
resolver = "3"

[workspace.metadata.dylint]
libraries = [
    { path = "manual_type_annotations_in_let_statements" },
    { path = "to_string_on_string_types" },
    { path = "unnecessary_qualified_type_paths" },
]
